services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: bench_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Важно: docker compose (не Swarm) игнорирует секцию deploy.*
    # Поэтому лимиты задаём через параметры сервиса.
    mem_limit: 512m
    cpus: 1.0

  redis:
    image: redis:7.4
    container_name: bench_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1.0
