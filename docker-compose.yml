services:
  postgres:
    image: postgres:16-alpine
    container_name: dating-postgres
    environment:
      POSTGRES_DB: dating_db
      POSTGRES_USER: dating_user
      POSTGRES_PASSWORD: dating_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dating_user -d dating_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dating-redis
    ports:
      - "6380:6380"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dating-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  media-service:
    build:
      context: .
      dockerfile: services/media-service/Dockerfile
    container_name: dating-media-service
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  profile-service:
    build:
      context: .
      dockerfile: services/profile-service/Dockerfile
    container_name: dating-profile-service
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      media-service:
        condition: service_started
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: services/profile-service/Dockerfile
    container_name: dating-celery-worker
    env_file:
      - .env
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: services/profile-service/Dockerfile
    container_name: dating-celery-beat
    env_file:
      - .env
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    restart: unless-stopped

  bot-service:
    build:
      context: .
      dockerfile: services/bot-service/Dockerfile
    container_name: dating-bot-service
    env_file:
      - .env
    environment:
      PROFILE_SERVICE_URL: http://localhost:8000
      MEDIA_SERVICE_URL: http://localhost:8001
    network_mode: host
    depends_on:
      - profile-service
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
