name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ─── Job 1: Run all tests ────────────────────────────────────────────────
  test:
    name: Run tests
    runs-on: ubuntu-latest

    env:
      # Dummy values — tests mock all DB/Redis calls, so no real services needed
      DATABASE_URL: postgresql+asyncpg://dating_user:dating_pass@localhost:5432/dating_db
      REDIS_URL: redis://localhost:6379/0
      PROFILE_SERVICE_URL: http://localhost:8000
      BOT_TOKEN: 0000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration -v --tb=short

      - name: Run bot tests
        run: pytest tests/bot -v --tb=short

      - name: Run full test suite with summary
        run: pytest tests/ -v --tb=short --no-header -q

  # ─── Job 2: Build Docker images ──────────────────────────────────────────
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test  # only runs if test job passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build profile-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/profile-service/Dockerfile
          push: false
          tags: dating-profile-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build bot-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/bot-service/Dockerfile
          push: false
          tags: dating-bot-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
